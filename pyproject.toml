[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spear"
version = "0.1.0"
description = "SPEAR: Single-cell-based Prediction of Gene Expression from Chromatin Accessibility Readouts"
readme = "README.md"
authors = [{name = "SPEAR developers"}]
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.1",
    "pysam>=0.22",
    "PyYAML>=6.0",
    "rpy2>=3.5",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scanpy>=1.10",
    "torch>=2.1",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "muon>=0.1.6",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "ruff>=0.5",
    "pytest>=7.4",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spear"]

[project.scripts]
spear = "spear.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = [".archive"]
