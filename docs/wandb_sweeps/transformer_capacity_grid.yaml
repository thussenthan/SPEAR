method: grid
metric:
  goal: maximize
  name: test_pearson
parameters:
  transformer_embed_dim:
    values: [128, 192, 256]
  transformer_num_layers:
    values: [2, 4, 6]
  transformer_dropout:
    values: [0.1, 0.2, 0.3]
  transformer_num_heads:
    value: 8
  lr_scheduler:
    value: cosine
  warmup_epochs:
    value: 5
  min_lr_ratio:
    value: 0.01
  gradient_accumulation_steps:
    value: 1

command:
  - ${env}
  - python
  - -m
  - spear.cli
  - --base-dir
  - .
  - --models
  - transformer
  - --multi-output
  - --wandb
  - --wandb-sweep
  - --gene-manifest
  - data/embryonic/manifests/1000_random_genes.csv
  - --cache-dir
  - data/.spear_cache
